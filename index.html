<style>
  :root {
    --bg: #e9eeec;
    --paper: #fbfcfb;
    --ink: #14262a;
    --muted: #5b6e70;
    --line: #cdd8d5;
    --accent: #0f5b57;
    --accent-soft: #dcebe8;
    --short: #a8381f;
    --short-soft: #f6e3de;
    --focus: #e0a100;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1819;
      --paper: #16262a;
      --ink: #e6efed;
      --muted: #8fa5a6;
      --line: #284045;
      --accent: #5fc4b8;
      --accent-soft: #1b3a3d;
      --short: #ff9a82;
      --short-soft: #3a211d;
      --focus: #f2c14e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    height: 100dvh;
    padding: 8px;
    display: flex;
    justify-content: center;
  }
  .num { font-variant-numeric: tabular-nums; }

  .sheet {
    width: 100%;
    max-width: 520px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  header {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 1rem; margin: 0; font-weight: 700; }
  .date { font-size: .75rem; color: var(--muted); }

  .head, .line {
    display: grid;
    grid-template-columns: 34% 30% 36%;
    align-items: center;
  }
  .head {
    flex: none;
    font-size: .72rem;
    font-weight: 600;
    color: var(--muted);
    background: var(--accent-soft);
    padding: 4px 14px;
  }
  .head span:nth-child(n+2) { text-align: right; }

  #rows {
    flex: 1 1 0;
    min-height: 0;
    display: grid;
    grid-template-rows: repeat(10, minmax(0, 1fr));
  }
  .line { border-bottom: 1px solid var(--line); min-height: 0; height: 100%; }
  .line .note { padding: 0 14px; font-weight: 700; font-size: clamp(.9rem, 2.6dvh, 1.2rem); }
  .line .amt {
    padding: 0 14px;
    text-align: right;
    color: var(--muted);
    font-size: clamp(.85rem, 2.4dvh, 1.1rem);
  }
  .line .amt.has { color: var(--ink); font-weight: 600; }

  input {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 0;
    outline: 0;
  }
  .line input {
    width: 100%;
    height: 100%;
    min-height: 0;
    text-align: right;
    padding: 0 10px;
    font-size: clamp(.95rem, 2.8dvh, 1.25rem);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  .line input::placeholder { color: var(--line); }
  .line input:focus, .advance input:focus {
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 2px var(--focus);
  }

  .totals { flex: none; padding: 0 14px; border-top: 2px solid var(--ink); }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 5px 0;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row .label { color: var(--muted); font-size: .88rem; }
  .row .label small { display: block; font-size: .7rem; }
  .row.total .label { color: var(--ink); font-weight: 700; font-size: .95rem; }
  .row.total .value {
    font-size: clamp(1.3rem, 4dvh, 1.8rem);
    font-weight: 800;
    color: var(--accent);
  }

  .advance { display: flex; align-items: center; gap: 4px; }
  .advance span { color: var(--muted); }
  .advance input {
    width: 140px;
    height: 36px;
    text-align: right;
    font-size: 1.1rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0 10px;
    background: var(--paper);
  }

  .result {
    flex: none;
    margin: 4px 14px 6px;
    padding: 6px 12px;
    border-radius: 8px;
    background: var(--accent-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .result .label { font-weight: 700; font-size: .95rem; }
  .result .label small { display: block; font-weight: 400; color: var(--muted); font-size: .7rem; }
  .result .value { font-size: clamp(1.2rem, 3.6dvh, 1.6rem); font-weight: 800; color: var(--accent); }
  .result.short { background: var(--short-soft); }
  .result.short .value { color: var(--short); }

  .actions { flex: none; display: flex; gap: 6px; padding: 0 14px 10px; }
  button {
    font: inherit;
    font-size: .85rem;
    font-weight: 600;
    height: 34px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    flex: 1;
  }
  button:hover { background: var(--accent-soft); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button.danger { color: var(--short); }
  button.danger:hover { background: var(--short-soft); }

  @media print {
    body { background: #fff; padding: 0; }
    .sheet { border: 0; max-width: none; }
    .actions { display: none; }
  }
</style>
</head>
<body>
<main class="sheet">
  <header>
    <h1>Cash counting sheet</h1>
    <span class="date" id="date"></span>
  </header>

  <div class="head"><span>Note (৳)</span><span>Qty</span><span>Total</span></div>
  <div id="rows"></div>

  <section class="totals">
    <div class="row total">
      <div class="label">Total cash<small id="noteCount"></small></div>
      <div class="value num" id="total">৳ 0</div>
    </div>
    <div class="row">
      <label class="label" for="advance">Advance amount</label>
      <div class="advance">
        <span>৳</span>
        <input id="advance" type="text" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Advance amount">
      </div>
    </div>
  </section>

  <div class="result" id="result">
    <div class="label"><span id="resultLabel">Remaining balance</span><small id="resultHint">Total cash minus advance</small></div>
    <div class="value num" id="remaining">৳ 0</div>
  </div>

  <div class="actions">
    <button type="button" id="clearQty">Clear counts</button>
    <button type="button" class="danger" id="clearAll">Clear all</button>
    <button type="button" id="print">Print</button>
  </div>
</main>

<script>
(function () {
  var DENOMS = [1000, 500, 200, 100, 50, 20, 10, 5, 2, 1];
  var KEY = "cashSheet.v1";
  var rowsEl = document.getElementById("rows");
  var qtyInputs = [];
  var lineCells = [];
  var advance = document.getElementById("advance");

  function fmt(n) { return "৳ " + Math.abs(n).toLocaleString("en-IN"); }
  function toInt(v) {
    var n = parseInt(String(v).replace(/[^\d]/g, ""), 10);
    return isNaN(n) ? 0 : n;
  }

  DENOMS.forEach(function (d, i) {
    var row = document.createElement("div");
    row.className = "line";

    var note = document.createElement("span");
    note.className = "note num";
    note.textContent = d.toLocaleString("en-IN");

    var inp = document.createElement("input");
    inp.type = "text";
    inp.inputMode = "numeric";
    inp.autocomplete = "off";
    inp.placeholder = "0";
    inp.setAttribute("aria-label", "Quantity of " + d + " notes");
    inp.addEventListener("input", function () {
      inp.value = inp.value.replace(/[^\d]/g, "").replace(/^0+(?=\d)/, "");
      update();
    });
    inp.addEventListener("focus", function () { inp.select(); });
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === "ArrowDown") {
        e.preventDefault();
        (qtyInputs[i + 1] || advance).focus();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (qtyInputs[i - 1]) qtyInputs[i - 1].focus();
      }
    });

    var amt = document.createElement("span");
    amt.className = "amt num";
    amt.textContent = "0";

    row.appendChild(note); row.appendChild(inp); row.appendChild(amt);
    rowsEl.appendChild(row);
    qtyInputs.push(inp);
    lineCells.push(amt);
  });

  advance.addEventListener("input", function () {
    advance.value = advance.value.replace(/[^\d]/g, "").replace(/^0+(?=\d)/, "");
    update();
  });
  advance.addEventListener("focus", function () { advance.select(); });
  advance.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp") { e.preventDefault(); qtyInputs[qtyInputs.length - 1].focus(); }
  });

  function update() {
    var total = 0, notes = 0;
    DENOMS.forEach(function (d, i) {
      var q = toInt(qtyInputs[i].value);
      var line = d * q;
      total += line; notes += q;
      lineCells[i].textContent = line.toLocaleString("en-IN");
      lineCells[i].classList.toggle("has", line > 0);
    });
    var adv = toInt(advance.value);
    var rem = total - adv;
    var short = rem < 0;

    document.getElementById("total").textContent = fmt(total);
    document.getElementById("noteCount").textContent = notes + (notes === 1 ? " note" : " notes") + " counted";
    document.getElementById("result").classList.toggle("short", short);
    document.getElementById("resultLabel").textContent = short ? "Short by" : "Remaining balance";
    document.getElementById("resultHint").textContent = short ? "Advance is more than the cash counted" : "Total cash minus advance";
    document.getElementById("remaining").textContent = fmt(rem);
    save();
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        q: qtyInputs.map(function (i) { return i.value; }),
        a: advance.value
      }));
    } catch (e) {}
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!s) return;
      qtyInputs.forEach(function (inp, i) { inp.value = s.q && s.q[i] ? s.q[i] : ""; });
      advance.value = s.a || "";
    } catch (e) {}
  }

  document.getElementById("clearQty").addEventListener("click", function () {
    qtyInputs.forEach(function (i) { i.value = ""; });
    update(); qtyInputs[0].focus();
  });
  document.getElementById("clearAll").addEventListener("click", function () {
    qtyInputs.forEach(function (i) { i.value = ""; });
    advance.value = "";
    update(); qtyInputs[0].focus();
  });
  document.getElementById("print").addEventListener("click", function () { window.print(); });

  document.getElementById("date").textContent = new Date().toLocaleDateString("en-GB", {
    weekday: "short", day: "numeric", month: "short", year: "numeric"
  });

  load();
  update();
})();
</script>
</body>
</html>
